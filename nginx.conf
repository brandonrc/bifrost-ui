# Serves the built dashboard SPA and reverse-proxies the control-plane API to
# the `bifrost` container (docker compose service name). Mirrors the Vite dev
# proxy so the same relative URLs (/api, /healthz, /docs) work in the image.
server {
    # 8080, not 80: the image runs as an unprivileged user (uid 101), and
    # binding a port below 1024 needs CAP_NET_BIND_SERVICE, which a hardened
    # deployment drops. Any chart or compose file mapping this must target
    # 8080 — see the note in the Dockerfile.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Control-plane API + health + Swagger UI → the bifrost container.
    location /api/ {
        proxy_pass http://bifrost:8484;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for the log-tail bridge.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location = /healthz {
        proxy_pass http://bifrost:8484;
    }
    location /docs {
        proxy_pass http://bifrost:8484;
        proxy_set_header Host $host;
    }

    # SPA client-side routing: everything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
